<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Minhas Contas</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff7fb;--card:#fff;--tx:#2a1f3d;--mu:#7a6f8f;--p:#7c3aed;--p2:#ec4899;--ok:#10b981;--bad:#ef4444;--bl:#3b82f6;--bd:#eadff5}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1426;--card:#251c36;--tx:#f3ecff;--mu:#a89cc0;--bd:#3a2d52}}
:root[data-theme="dark"]{--bg:#1a1426;--card:#251c36;--tx:#f3ecff;--mu:#a89cc0;--bd:#3a2d52}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding-bottom:84px}
header{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:14px 16px;font-weight:700;font-size:19px}
#app{padding:12px 14px;max-width:640px;margin:auto}
h3{margin:16px 0 6px}
.mn{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:18px}
.mn button{border:0;background:var(--card);color:var(--p);font-size:22px;width:42px;height:42px;border-radius:50%;box-shadow:0 1px 4px #0003}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.c{background:var(--card);border-radius:14px;padding:12px;border-left:5px solid;box-shadow:0 1px 4px #0002}
.c small{display:block;color:var(--mu)}.c b{font-size:18px}
.r{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:10px;margin:6px 0;box-shadow:0 1px 3px #0002}
.f{flex:1;min-width:0}.f small{display:block;color:var(--mu)}
.ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--ok);background:none;color:#fff;font-size:16px;flex:none}
.ck.on{background:var(--ok)}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.bt{display:block;width:100%;border:0;border-radius:12px;padding:12px;margin-top:10px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font:700 16px system-ui}
.bt.dn{background:var(--bad)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:16px system-ui;margin-top:4px}
label{display:block;margin-top10px;margin-top:10px;font-size:14px;color:var(--mu)}
.c2 input,.c2 select{margin-top:8px}
.al{background:#fee2e2;color:#991b1b;padding:10px;border-radius:12px;margin:10px 0}
.x{border:0;background:none;color:var(--mu);font-size:18px}
.empty,.lg{text-align:center;color:var(--mu);padding:10px}
.br{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin:4px 0}.br i{display:block;height:100%}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cg b{text-align:center;color:var(--mu)}
.cd{height:48px;background:var(--card);border-radius:10px;text-align:center;padding-top:4px}
.cd.sel{outline:2px solid var(--p)}.cd.tdy span{font-weight:700;color:var(--p)}
.cd em{display:flex;gap:3px;justify-content:center;margin-top:3px}
u{width:8px;height:8px;border-radius:50%;display:block}u.ok{background:var(--ok)}u.bad{background:var(--bad)}u.bl{background:var(--bl)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mu);font-size:11px;padding:8px 0}
nav button span{display:block;font-size:20px}nav button.on{color:var(--p);font-weight:700}
#sh{display:none;position:fixed;inset:0;z-index:10}
.bk{position:absolute;inset:0;background:#0007}
.sb{position:absolute;bottom:0;left:0;right:0;max-width:640px;margin:auto;max-height:88%;overflow:auto;background:var(--bg);padding:16px;border-radius:20px 20px 0 0}
</style></head><body>
<header>💜 Minhas Contas</header>
<div id="app"></div><div id="sh"></div>
<nav id="nv"></nav>
<script>
const KEY='contas_v1';
let S={bills:[],exps:[],cats:[{n:'Mercado',c:'#ef4444',g:0},{n:'Padaria',c:'#f59e0b',g:0},{n:'Hortifruti',c:'#10b981',g:0},{n:'Açougue',c:'#ec4899',g:0},{n:'Farmácia',c:'#3b82f6',g:0},{n:'Outros',c:'#8b5cf6',g:0}],seen:0};
try{let r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const p2=n=>String(n).padStart(2,'0');
const td=()=>{let d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const MN=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
let M=td().slice(0,7),tab='home',selDay=td(),sheetOpen=0,lastCat='';
const mlabel=m=>MN[+m.slice(5)-1]+' '+m.slice(0,4);
const shM=(m,n)=>{let d=new Date(+m.slice(0,4),+m.slice(5)-1+n,1);return d.getFullYear()+'-'+p2(d.getMonth()+1)};
const addM=(d,n)=>{let[y,m,dd]=d.split('-').map(Number),t=new Date(y,m-1+n,1),l=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return t.getFullYear()+'-'+p2(t.getMonth()+1)+'-'+p2(Math.min(dd,l))};
const fd=d=>d.slice(8)+'/'+d.slice(5,7);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const bm=m=>S.bills.filter(b=>b.d.startsWith(m)).sort((a,b)=>a.d.localeCompare(b.d));
const em=m=>S.exps.filter(e=>e.d.startsWith(m));
const sum=a=>a.reduce((s,x)=>s+(+x.v||0),0);
const cc=n=>(S.cats.find(c=>c.n===n)||{c:'#888'}).c;
const empty=t=>`<div class=empty>${t}</div>`;
const card=(t,v,c)=>`<div class=c style="border-color:${c}"><small>${t}</small><b>${v}</b></div>`;
const nav=()=>`<div class=mn><button onclick="mv(-1)">‹</button><b>${mlabel(M)}</b><button onclick="mv(1)">›</button></div>`;
function mv(n){M=shM(M,n);selDay=M==td().slice(0,7)?td():M+'-01';render()}
function row(b){return `<div class=r onclick="editB('${b.id}')"><button class="ck ${b.p?'on':''}" onclick="event.stopPropagation();tg('${b.id}')">${b.p?'✓':''}</button><div class=f><b>${esc(b.n)}</b><small>${fd(b.d)}${!b.p&&b.d<td()?' · ⚠️ atrasada':''}</small></div><b>${R(b.v)}</b></div>`}
function erow(x){return `<div class=r><span class=dot style="background:${cc(x.c)}"></span><div class=f><b>${esc(x.c)}</b><small>${fd(x.d)}${x.o?' · '+esc(x.o):''}</small></div><b>${R(x.v)}</b><button class=x onclick="dlE('${x.id}')">✕</button></div>`}
/* sheets + back button */
function sheet(h){$('sh').innerHTML=`<div class=bk onclick="back()"></div><div class=sb>${h}</div>`;if(!sheetOpen){history.pushState({s:1},'');sheetOpen=1}$('sh').style.display='block'}
function closeSheet(){$('sh').style.display='none';$('sh').innerHTML='';sheetOpen=0}
function back(){if(sheetOpen)history.back()}
addEventListener('popstate',()=>{if(sheetOpen)closeSheet();else if(tab!='home'){tab='home';render()}});
function setTab(t){if(t==tab)return;if(tab=='home')history.pushState({t:1},'');tab=t;render()}
/* views */
function home(){let b=bm(M),t=td(),at=b.filter(x=>!x.p&&x.d<t),pr=S.bills.filter(x=>!x.p&&x.d>=t).sort((a,b)=>a.d.localeCompare(b.d)).slice(0,6);
return nav()+`<div class=g>${card('Contas do mês',R(sum(b)),'var(--p)')}${card('Já pago',R(sum(b.filter(x=>x.p))),'var(--ok)')}${card('Falta pagar',R(sum(b.filter(x=>!x.p))),'var(--p2)')}${card('Gastos variados',R(sum(em(M))),'var(--bl)')}</div>`+(at.length?`<div class=al>⚠️ ${at.length} conta(s) atrasada(s): ${R(sum(at))}</div>`:'')+`<h3>Próximos vencimentos</h3>`+(pr.map(row).join('')||empty('Nenhuma conta pendente 🎉'))}
function contas(){let b=bm(M);return nav()+`<p class=lg>Total: <b>${R(sum(b))}</b> · pendente: <b>${R(sum(b.filter(x=>!x.p)))}</b></p>`+(b.map(row).join('')||empty('Nenhuma conta neste mês.'))+`<button class=bt onclick="addB()">+ Nova conta</button>`}
function cal(){let[y,m]=M.split('-').map(Number),f=new Date(y,m-1,1).getDay(),n=new Date(y,m,0).getDate(),h='';
for(let i=0;i<f;i++)h+='<i></i>';
for(let d=1;d<=n;d++){let ds=M+'-'+p2(d),b=S.bills.filter(x=>x.d==ds),e=S.exps.some(x=>x.d==ds);
h+=`<div class="cd ${ds==selDay?'sel':''} ${ds==td()?'tdy':''}" onclick="selDay='${ds}';render()"><span>${d}</span><em>${b.length?`<u class="${b.every(x=>x.p)?'ok':'bad'}"></u>`:''}${e?'<u class=bl></u>':''}</em></div>`}
let sb=S.bills.filter(x=>x.d==selDay),se=S.exps.filter(x=>x.d==selDay);
return nav()+`<div class=cg>${['D','S','T','Q','Q','S','S'].map(x=>`<b>${x}</b>`).join('')}${h}</div><p class=lg>🔴 pendente · 🟢 pago · 🔵 gasto</p><h3>Dia ${fd(selDay)}</h3>`+((sb.map(row).join('')+se.map(erow).join(''))||empty('Nada neste dia'))+`<button class=bt onclick="addB('${selDay}')">+ Conta neste dia</button>`}
function gas(){let e=em(M);if(!lastCat||!S.cats.some(c=>c.n==lastCat))lastCat=(S.cats[0]||{}).n||'';
return nav()+`<div class=c2><select id=ec>${S.cats.map(c=>`<option ${c.n==lastCat?'selected':''}>${esc(c.n)}</option>`).join('')}</select><input id=ev type=number step=0.01 inputmode=decimal placeholder="Valor gasto (R$)"><input id=ed type=date value="${td()}"><input id=eo placeholder="Observação (opcional)"><button class=bt onclick="addE()">+ Lançar gasto</button></div><h3>Total por categoria</h3>`+S.cats.map((c,i)=>{let s=sum(e.filter(x=>x.c==c.n)),p=c.g?Math.min(100,s/c.g*100):0;return `<div class=r onclick="catE(${i})"><span class=dot style="background:${c.c}"></span><div class=f><b>${esc(c.n)}</b>${c.g?`<div class=br><i style="width:${p}%;background:${s>c.g?'var(--bad)':c.c}"></i></div><small>meta ${R(c.g)}</small>`:''}</div><b>${R(s)}</b></div>`}).join('')+`<h3>Lançamentos do mês</h3>`+(e.sort((a,b)=>b.d.localeCompare(a.d)).map(erow).join('')||empty('Nenhum gasto lançado.'))}
function bal(){let b=bm(M),e=em(M),pm=shM(M,-1),tb=sum(b),te=sum(e),T=tb+te,P=sum(bm(pm))+sum(em(pm)),df=T-P,mx=Math.max(1,...S.cats.map(c=>sum(e.filter(x=>x.c==c.n))));
const TL={fixa:'Contas fixas',conta:'Contas únicas',cartao:'Cartões',parcela:'Empréstimos/parcelas'};
return nav()+`<div class=g>${card('Total geral',R(T),'var(--p)')}${card('Contas',R(tb),'var(--p2)')}${card('Gastos variados',R(te),'var(--bl)')}${card('Contas pagas',R(sum(b.filter(x=>x.p))),'var(--ok)')}</div><p class=lg>Falta pagar: <b>${R(sum(b.filter(x=>!x.p)))}</b><br>${P?(df>0?`📈 ${R(df)} a mais que em ${mlabel(pm)}`:`📉 ${R(-df)} a menos que em ${mlabel(pm)}`):'Sem dados do mês anterior'}</p><h3>Contas por tipo</h3>`+Object.keys(TL).map(k=>`<div class=r><div class=f>${TL[k]}</div><b>${R(sum(b.filter(x=>x.t==k)))}</b></div>`).join('')+`<h3>Gastos por categoria</h3>`+S.cats.map(c=>({c,s:sum(e.filter(x=>x.c==c.n))})).sort((a,b)=>b.s-a.s).map(o=>`<div class=r><div class=f><b>${esc(o.c.n)}</b><div class=br><i style="width:${o.s/mx*100}%;background:${o.c.c}"></i></div></div><b>${R(o.s)}</b></div>`).join('')}
function more(){return `<h3>Categorias de gastos</h3>`+S.cats.map((c,i)=>`<div class=r onclick="catE(${i})"><span class=dot style="background:${c.c}"></span><div class=f><b>${esc(c.n)}</b><small>${c.g?'meta '+R(c.g):'sem meta'}</small></div>›</div>`).join('')+`<button class=bt onclick="catE(-1)">+ Nova categoria</button><h3>Mais</h3><button class=bt onclick="bk()">💾 Backup / Restaurar</button><button class=bt onclick="tut(0)">❓ Ver tutorial</button><button class="bt dn" onclick="wipe()">Apagar todos os dados</button>`}
const V={home,contas,cal,gas,bal,more},TB=[['home','🏠','Início'],['contas','🧾','Contas'],['cal','📅','Agenda'],['gas','🛒','Gastos'],['bal','📊','Balanço'],['more','⚙️','Mais']];
function render(){$('app').innerHTML=V[tab]();$('nv').innerHTML=TB.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="setTab('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('')}
/* contas */
function addB(dt){sheet(`<h3>Nova conta</h3><label>Tipo</label><select id=bt onchange="tc()"><option value=conta>Conta única</option><option value=fixa>Conta fixa (repete 12 meses)</option><option value=cartao>Fatura de cartão</option><option value=parcela>Empréstimo / parcelado</option></select><label id=ln>Nome da conta</label><input id=bn><label id=lv>Valor</label><input id=bv type=number step=0.01 inputmode=decimal><label>Vencimento</label><input id=bd type=date value="${dt||(M==td().slice(0,7)?td():M+'-10')}"><div id=bx style="display:none"><label>Número de parcelas</label><input id=bq type=number value=12></div><button class=bt onclick="svB()">Salvar</button>`)}
function tc(){let t=$('bt').value;$('bx').style.display=t=='parcela'?'block':'none';$('ln').textContent=t=='cartao'?'Nome do cartão':t=='parcela'?'Nome do empréstimo':'Nome da conta';$('lv').textContent=t=='parcela'?'Valor de cada parcela':t=='cartao'?'Valor da fatura':'Valor'}
function svB(){let t=$('bt').value,n=$('bn').value.trim(),v=+$('bv').value,d=$('bd').value;if(!n||!d||!(v>=0)||$('bv').value===''){alert('Preencha nome, valor e vencimento.');return}
let g=uid(),k=t=='fixa'?12:t=='parcela'?Math.max(1,+$('bq').value||1):1;
for(let i=0;i<k;i++)S.bills.push({id:uid(),n:t=='cartao'?'Fatura '+n:t=='parcela'?`${n} (${i+1}/${k})`:n,v,d:addM(d,i),p:0,t,g:k>1?g:''});
save();back();render()}
function editB(id){let b=S.bills.find(x=>x.id==id);sheet(`<h3>Editar conta</h3><label>Nome</label><input id=bn value="${esc(b.n)}"><label>Valor</label><input id=bv type=number step=0.01 inputmode=decimal value="${b.v}"><label>Vencimento</label><input id=bd type=date value="${b.d}"><label><input type=checkbox id=bp style="width:auto" ${b.p?'checked':''}> Paga</label>${b.g?`<label><input type=checkbox id=bf style="width:auto"> Aplicar o novo valor aos próximos meses/parcelas</label>`:''}<button class=bt onclick="upB('${id}')">Salvar</button><button class="bt dn" onclick="dlB('${id}')">Excluir</button>${b.g?`<button class="bt dn" onclick="dlG('${id}')">Excluir toda a série</button>`:''}`)}
function upB(id){let b=S.bills.find(x=>x.id==id),v=+$('bv').value;b.n=$('bn').value.trim()||b.n;b.v=v;b.d=$('bd').value||b.d;b.p=$('bp').checked?1:0;
if($('bf')&&$('bf').checked)S.bills.forEach(x=>{if(x.g==b.g&&x.d>b.d)x.v=v});save();back();render()}
function dlB(id){if(confirm('Excluir esta conta?')){S.bills=S.bills.filter(x=>x.id!=id);save();back();render()}}
function dlG(id){let b=S.bills.find(x=>x.id==id);if(confirm('Excluir todas as contas desta série?')){S.bills=S.bills.filter(x=>x.g!=b.g);save();back();render()}}
function tg(id){let b=S.bills.find(x=>x.id==id);b.p=b.p?0:1;save();render()}
/* gastos */
function addE(){let v=+$('ev').value,d=$('ed').value,c=$('ec').value;if(!(v>0)||!d||!c){alert('Informe categoria, valor e data.');return}
lastCat=c;S.exps.push({id:uid(),c,v,d,o:$('eo').value.trim()});save();render()}
function dlE(id){S.exps=S.exps.filter(x=>x.id!=id);save();render()}
function catE(i){let c=i<0?{n:'',c:'#7c3aed',g:0}:S.cats[i];sheet(`<h3>${i<0?'Nova':'Editar'} categoria</h3><label>Nome</label><input id=cn value="${esc(c.n)}"><label>Cor</label><input id=ccol type=color value="${c.c}"><label>Meta mensal (opcional)</label><input id=cg type=number step=0.01 inputmode=decimal value="${c.g||''}"><button class=bt onclick="svC(${i})">Salvar</button>${i>=0?`<button class="bt dn" onclick="dlC(${i})">Excluir</button>`:''}`)}
function svC(i){let n=$('cn').value.trim();if(!n)return;let o={n,c:$('ccol').value,g:+$('cg').value||0};if(i<0)S.cats.push(o);else{let old=S.cats[i].n;S.exps.forEach(x=>{if(x.c==old)x.c=n});S.cats[i]=o}save();back();render()}
function dlC(i){if(confirm('Excluir categoria? Os gastos já lançados continuam salvos.')){S.cats.splice(i,1);save();back();render()}}
/* backup */
function bk(){sheet(`<h3>💾 Backup</h3><label>Copie este texto e guarde (notas, e-mail, WhatsApp):</label><textarea id=bj rows=6>${esc(JSON.stringify(S))}</textarea><button class=bt onclick="cp()">Copiar</button><label>Para restaurar: cole o texto acima e toque abaixo.</label><button class="bt dn" onclick="rs()">Restaurar backup</button>`)}
function cp(){let t=$('bj');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand('copy')}alert('Copiado!')}
function rs(){try{let o=JSON.parse($('bj').value);if(!o.bills)throw 0;if(confirm('Substituir todos os dados atuais?')){S=Object.assign({bills:[],exps:[],cats:[],seen:1},o);save();back();render()}}catch(e){alert('Texto de backup inválido.')}}
function wipe(){if(confirm('Apagar TODOS os dados?')&&confirm('Tem certeza? Não dá para desfazer.')){S.bills=[];S.exps=[];save();render()}}
/* tutorial */
const TUT=[['👋 Bem-vinda!','Este app organiza suas contas a pagar e seus gastos do dia a dia. Vou mostrar rapidinho como tudo funciona.'],['🧾 Contas','Na aba Contas, toque em "+ Nova conta": conta única, conta fixa (repete por 12 meses), fatura de cartão ou empréstimo parcelado (informe o valor da parcela e quantas vezes). Toque no círculo para marcar como paga. Toque na conta para mudar o valor quando ele variar.'],['📅 Agenda','Os dias com contas ficam marcados: vermelho = pendente, verde = pago, azul = gasto. Toque no dia para ver o que vence e quanto.'],['🛒 Gastos','Lance o que gastou no dia (padaria, mercado, hortifruti, açougue, farmácia...) escolhendo a categoria e o valor. O app soma tudo por categoria no mês e mostra a barra da meta, se você definir uma.'],['📊 Balanço','No fim do mês veja quanto foi pago, quanto falta, onde mais gastou e a comparação com o mês anterior. Use as setas ‹ › para ver outros meses.'],['💾 Seus dados','Tudo fica salvo neste aparelho. Em "Mais" você faz o backup copiando o texto, para não perder nada. Você pode rever este tutorial lá também.']];
function tut(i){let[t,d]=TUT[i],l=i==TUT.length-1;sheet(`<h3>${t}</h3><p>${d}</p><small>${i+1}/${TUT.length}</small><button class=bt onclick="${l?'back()':'tut('+(i+1)+')'}">${l?'Começar!':'Próximo'}</button>${l?'':'<button class="bt dn" onclick="back()">Pular</button>'}`)}
render();if(!S.seen){S.seen=1;save();tut(0)}
</script></body></html>
